<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador JENUINO · GraphRAG local</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --border:#272b34; --fg:#e8eaed;
    --muted:#9aa0ab; --accent:#6ea8fe; --chip:#232a38; --chip-fg:#a9c7ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--fg);line-height:1.5}
  header{padding:32px 20px 12px;text-align:center}
  h1{margin:0;font-size:1.7rem;font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-top:6px}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px 60px}
  .searchbar{display:flex;gap:10px;margin:22px 0 6px;position:sticky;top:0;
             background:var(--bg);padding:12px 0;z-index:5}
  input[type=search]{flex:1;padding:14px 16px;font-size:1rem;border-radius:12px;
       border:1px solid var(--border);background:var(--card);color:var(--fg)}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  button{padding:0 22px;font-size:1rem;border:0;border-radius:12px;cursor:pointer;
         background:var(--accent);color:#0b1020;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .status{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px}
  .ok{background:#4ade80}.no{background:#f59e0b}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
        padding:16px 18px;margin:12px 0}
  .card h3{margin:0 0 4px;font-size:1.08rem}
  .card h3 a{color:var(--fg);text-decoration:none}
  .card h3 a:hover{color:var(--accent)}
  .meta{color:var(--muted);font-size:.82rem;margin-bottom:8px}
  .abstract{font-size:.92rem;color:#c8ccd4;margin:6px 0}
  .chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--chip);color:var(--chip-fg);font-size:.74rem;
        padding:3px 9px;border-radius:999px}
  .rel{color:var(--muted);font-size:.75rem;margin-top:8px}
  .rel b{color:#c6a6ff}
  .kwlabel{color:var(--muted);font-size:.7rem;margin-top:10px;text-transform:uppercase;letter-spacing:.04em}
  .fix{color:var(--muted);font-size:.9rem;margin:4px 0 14px}
  .fix b{color:var(--fg)}
  .warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.45);color:#fde68a;
        border-radius:10px;padding:10px 14px;margin:4px 0 14px;font-size:.9rem}
  .warn b{color:#fef3c7}
  .fix a{color:var(--accent);text-decoration:none}
  .score{float:right;font-size:.78rem;color:var(--muted)}
  .actions{margin-top:12px;display:flex;gap:8px;align-items:center}
  .btn2{font-size:.78rem;padding:5px 12px;border-radius:8px;border:1px solid var(--border);
        background:var(--chip);color:var(--fg);cursor:pointer;text-decoration:none}
  .btn2:hover{border-color:var(--accent);color:var(--accent)}
  pre.bibtex{display:none;margin-top:10px;padding:12px;background:#0c0e13;border:1px solid var(--border);
        border-radius:10px;font-size:.78rem;color:#c8ccd4;overflow-x:auto;white-space:pre;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .empty{text-align:center;color:var(--muted);margin-top:40px}
  .timeline{background:var(--card);border:1px solid var(--border);border-radius:14px;
            padding:12px 14px 6px;margin:4px 0 16px}
  .tl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .tl-sum{font-size:.84rem;color:var(--muted)}
  .tl-sum b{color:var(--fg)}
  .tl-mode{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .tl-mode button{font-size:.74rem;padding:4px 10px;border:0;border-radius:0;background:transparent;
                  color:var(--muted);font-weight:500;cursor:pointer}
  .tl-mode button.on{background:var(--chip);color:var(--fg)}
  .timeline svg{display:block;width:100%;height:auto;margin-top:6px}
  .timeline .bar{fill:var(--accent);cursor:pointer}
  .timeline .bar.dim{opacity:.3}
  .timeline .bar:hover,.timeline .bar:focus{fill:#9cc2ff;outline:none}
  .timeline .axis{fill:var(--muted);font-size:10px}
  .timeline .grid{stroke:var(--border);stroke-width:1}
  .tl-filter{font-size:.82rem;color:var(--muted);margin:0 0 12px}
  .tl-filter a{color:var(--accent);text-decoration:none}
  .spinner{display:none;text-align:center;margin-top:30px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Buscador <span>JENUINO</span></h1>
  <div class="sub">Búsqueda semántica sobre los artículos de las JENUI<span id="years"></span> · GraphRAG en local</div>
</header>
<div class="wrap">
  <div class="searchbar">
    <input id="q" type="search" placeholder="p. ej. gamificación en programación, evaluación por pares, ABP…" autofocus>
    <button id="go">Buscar</button>
  </div>
  <div class="status" id="status"></div>
  <div class="spinner" id="spinner">Buscando…</div>
  <div id="results"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const results = $("#results"), spinner = $("#spinner");
// totales del corpus por año (para la prevalencia) y estado de la vista actual
let corpus = {min: null, max: null, total: {}};
let current = null, yearFilter = null;
let chartMode = "n";
try { chartMode = localStorage.getItem("jenuino.grafica") || "n"; } catch(e) {}

async function status(){
  try{
    const s = await (await fetch("/api/status")).json();
    if (s.anio_min && s.anio_max) $("#years").textContent = ` (${s.anio_min}–${s.anio_max})`;
    corpus = {min: s.anio_min, max: s.anio_max, total: s.articulos_por_anio || {}};
    $("#status").innerHTML =
      `${s.articulos} artículos · ` +
      `<span class="dot ${s.fulltext_listo?'ok':'no'}"></span>búsqueda ${s.fulltext_listo?'lista':'no lista'} · ` +
      `<span class="dot ${s.grafo_listo?'ok':'no'}"></span>grafo ${s.grafo_listo?`(${s.entidades} conceptos)`:'construyéndose…'}`;
  }catch(e){}
}

function esc(t){return (t||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// Chips de palabras clave del artículo. Descarta fragmentos demasiado largos:
// una palabra clave real es corta, así que un texto largo es basura de extracción.
function kwChips(keywords){
  // una palabra clave real es corta y de pocas palabras; lo demás es prosa colada
  const kws = (keywords||"").split(/[,;]/).map(k=>k.trim())
    .filter(k => k.length>=2 && k.length<=40 && k.split(/\s+/).length<=5).slice(0,8);
  if(!kws.length) return "";
  return `<div class="kwlabel">Palabras clave</div><div class="chips">`
    + kws.map(k=>`<span class="chip">${esc(k)}</span>`).join("") + `</div>`;
}

function render(data){
  current = data; yearFilter = null;
  draw();
}

// Gráfica de barras: resultados por año, de la primera a la última edición del
// corpus (los años sin resultados, a cero). En modo "%" cada barra es la
// fracción de los artículos de ese año que salen en la búsqueda: el número de
// artículos por edición varía mucho (de ~40 a ~95), así que el recuento solo
// puede engañar al comparar épocas.
function timeline(rows){
  if(!corpus.min || !corpus.max || !rows.length) return "";
  const years = []; for(let y = corpus.min; y <= corpus.max; y++) years.push(y);
  const count = {}; rows.forEach(r => { if(r.year) count[r.year] = (count[r.year]||0) + 1; });
  const value = y => chartMode === "pct"
    ? (corpus.total[y] ? 100 * (count[y]||0) / corpus.total[y] : 0) : (count[y]||0);
  const vmax = Math.max(...years.map(value), chartMode === "pct" ? 1 : 1);
  const W = 640, H = 150, ml = 30, mr = 6, mt = 8, mb = 22;
  const step = (W - ml - mr) / years.length, bw = Math.max(2, step * 0.72);
  const y0 = H - mb, scale = (H - mt - mb) / vmax;
  const fmt = v => chartMode === "pct" ? v.toFixed(v < 10 ? 1 : 0) + " %" : String(Math.round(v));
  let bars = "", labels = "";
  years.forEach((y, i) => {
    const x = ml + i * step + (step - bw) / 2, v = value(y), n = count[y] || 0;
    if (n) {
      const h = Math.max(1.5, v * scale), tot = corpus.total[y] || 0;
      const tip = `${y}: ${n} artículo${n > 1 ? "s" : ""}` + (tot ? ` (${(100*n/tot).toFixed(1)} % de los ${tot} de ese año)` : "");
      bars += `<rect class="bar${yearFilter && yearFilter !== y ? " dim" : ""}" data-year="${y}" tabindex="0"
        x="${x.toFixed(1)}" y="${(y0 - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        aria-label="${tip}"><title>${tip}</title></rect>`;
    }
    // etiquetas cada 5 años, más la primera y la última edición (sin las de cada
    // 5 años que quedarían pegadas a ellas: 2025 junto a 2026)
    const edge = y === corpus.min || y === corpus.max;
    const nearEdge = Math.abs(y - corpus.min) < 3 || Math.abs(y - corpus.max) < 3;
    if (edge || (y % 5 === 0 && !nearEdge))
      labels += `<text class="axis" x="${(ml + i*step + step/2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${y}</text>`;
  });
  const grid = `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${y0}" y2="${y0}"/>
    <line class="grid" x1="${ml}" x2="${W - mr}" y1="${mt}" y2="${mt}" stroke-dasharray="3 3"/>
    <text class="axis" x="${ml - 4}" y="${mt + 4}" text-anchor="end">${fmt(vmax)}</text>
    <text class="axis" x="${ml - 4}" y="${y0}" text-anchor="end">0</text>`;
  // resumen: rango, mediana y peso de los últimos cinco años
  const ys = rows.map(r => r.year).filter(Boolean).sort((a, b) => a - b);
  const median = ys[Math.floor((ys.length - 1) / 2)];
  const recentFrom = corpus.max - 4, recent = ys.filter(y => y >= recentFrom).length;
  const sum = `<b>${rows.length}</b> artículo${rows.length > 1 ? "s" : ""} entre <b>${ys[0]}</b> y <b>${ys[ys.length-1]}</b>
    · mediana <b>${median}</b> · <b>${recent}</b> en los últimos 5 años (${recentFrom}–${corpus.max})`;
  return `<div class="timeline">
    <div class="tl-head"><div class="tl-sum">${sum}</div>
      <div class="tl-mode" role="group" aria-label="Escala de la gráfica">
        <button data-mode="n" class="${chartMode === "n" ? "on" : ""}">Nº de artículos</button>
        <button data-mode="pct" class="${chartMode === "pct" ? "on" : ""}">% del año</button>
      </div></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultados por año de edición">${grid}${bars}${labels}</svg>
  </div>`;
}

function draw(){
  const data = current;
  if(data.error){ results.innerHTML = `<div class="empty">${esc(data.error)}</div>`; return; }
  // aviso de corrección ortográfica, con opción de buscar el texto tal cual
  const fix = data.corregido ? `<div class="fix">Mostrando resultados para
      <b>${esc(data.corregido)}</b> · <a href="#" id="raw">buscar
      «${esc(data.original)}» tal cual</a></div>` : "";
  const warn = data.aviso ? `<div class="warn">⚠️ <b>Similitud baja</b> (la del mejor resultado es
      ${data.aviso.similitud_maxima.toFixed(2)}). Es probable que en las JENUI no haya artículos sobre
      este tema: estos son los más cercanos, pero revísalos con cautela.</div>` : "";
  if(!data.results.length){ results.innerHTML = fix + warn + `<div class="empty">Sin resultados.</div>`; bind(); return; }
  const rows = yearFilter ? data.results.filter(r => r.year === yearFilter) : data.results;
  const filter = yearFilter ? `<div class="tl-filter">Mostrando los <b>${rows.length}</b> de ${yearFilter}
      · <a href="#" id="allyears">ver los ${data.results.length}</a></div>` : "";
  results.innerHTML = fix + warn + timeline(data.results) + filter + rows.map(card).join("");
  bind();
}

// eventos que hay que volver a enganchar cada vez que se redibuja
function bind(){
  const raw = document.getElementById("raw");
  if(raw) raw.onclick = e => { e.preventDefault(); buscar(false); };  // buscar tal cual
  const all = document.getElementById("allyears");
  if(all) all.onclick = e => { e.preventDefault(); yearFilter = null; draw(); };
  results.querySelectorAll(".tl-mode button").forEach(b => b.onclick = () => {
    chartMode = b.dataset.mode;
    try { localStorage.setItem("jenuino.grafica", chartMode); } catch(e) {}
    draw();
  });
  results.querySelectorAll(".timeline .bar").forEach(bar => {
    const pick = () => { const y = +bar.dataset.year; yearFilter = yearFilter === y ? null : y; draw(); };
    bar.onclick = pick;
    bar.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } };
  });
}

function card(r){
  return `
    <div class="card">
      <span class="score" title="Similitud semántica (coseno) entre tu consulta y el artículo: es el valor real, no un porcentaje relativo. Los resultados se ordenan por esta similitud más un pequeño bonus si el artículo comparte conceptos del grafo con el tema.">similitud ${r.text_score.toFixed(2)}</span>
      <h3><a href="${r.pdf}" target="_blank">${esc(r.title)}</a></h3>
      <div class="meta">${esc(r.authors)}${r.year? ' · JENUI '+r.year:''}${r.category && !/^[-–—\s]*$/.test(r.category) ? ' · '+esc(r.category):''}</div>
      <div class="abstract">${esc(r.abstract)}</div>
      ${r.shared_concepts && r.shared_concepts.length ?
        `<div class="rel">🔗 Relacionado por: <b>${r.shared_concepts.map(esc).join(', ')}</b></div>`:''}
      ${kwChips(r.keywords)}
      <div class="actions">
        <a class="btn2" href="${r.pdf}" target="_blank">📄 PDF</a>
        ${r.bibtex ? `<button class="btn2" onclick="toggleBib('${r.id}')">📚 BibTeX</button>
        <button class="btn2" onclick="copyBib('${r.id}', this)">📋 Copiar cita</button>`:''}
      </div>
      ${r.bibtex ? `<pre class="bibtex" id="bib-${r.id}">${esc(r.bibtex)}</pre>`:''}
    </div>`;
}

async function buscar(corregir=true){
  const q = $("#q").value.trim();
  if(q.length<2) return;
  try { history.replaceState(null, "", "?q=" + encodeURIComponent(q)); } catch(e) {}
  results.innerHTML=""; spinner.style.display="block"; $("#go").disabled=true;
  try{
    const url = "/api/search?q="+encodeURIComponent(q)+(corregir?"":"&corregir=false");
    const data = await (await fetch(url)).json();
    render(data);
  }catch(e){ results.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; }
  spinner.style.display="none"; $("#go").disabled=false;
}

function toggleBib(id){
  const el = document.getElementById("bib-"+id);
  if(el) el.style.display = el.style.display==="block" ? "none" : "block";
}
async function copyBib(id, btn){
  const el = document.getElementById("bib-"+id);
  if(!el) return;
  try{
    await navigator.clipboard.writeText(el.textContent);
    const prev = btn.textContent; btn.textContent = "✅ Copiado";
    setTimeout(()=>btn.textContent = prev, 1500);
  }catch(e){
    el.style.display = "block";   // fallback: mostrar para copiar a mano
  }
}

$("#go").onclick = () => buscar();
$("#q").addEventListener("keydown", e => { if(e.key==="Enter") buscar(); });
setInterval(status, 15000);
// ?q=... abre directamente esa búsqueda (enlaces compartibles); los totales por
// año del corpus se cargan antes, porque la gráfica los necesita
(async () => {
  await status();
  const q = new URLSearchParams(location.search).get("q");
  if (q) { $("#q").value = q; buscar(); }
})();
</script>
</body>
</html>
