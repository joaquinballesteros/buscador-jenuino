<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temas · Buscador JENUINO</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --border:#272b34; --fg:#e8eaed;
    --muted:#9aa0ab; --accent:#6ea8fe; --chip:#232a38; --chip-fg:#a9c7ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--fg);line-height:1.5}
  header{padding:32px 20px 12px;text-align:center}
  h1{margin:0;font-size:1.7rem;font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:.9rem;margin-top:6px}
  .back{color:var(--muted);font-size:.82rem;text-decoration:none}
  .back:hover{color:var(--accent)}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px 60px}
  .filterbar{display:flex;gap:10px;margin:22px 0 6px;position:sticky;top:0;
             background:var(--bg);padding:12px 0;z-index:5}
  input[type=search]{flex:1;padding:12px 16px;font-size:.95rem;border-radius:12px;
       border:1px solid var(--border);background:var(--card);color:var(--fg)}
  input[type=search]:focus{outline:none;border-color:var(--accent)}
  .status{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:10px}
  .empty{text-align:center;color:var(--muted);margin-top:40px}

  .tema{background:var(--card);border:1px solid var(--border);border-radius:14px;
        margin:10px 0;overflow:hidden}
  .tema-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;
            background:none;border:0;width:100%;text-align:left;color:var(--fg);font:inherit}
  .tema-row:hover .concepto{color:var(--accent)}
  .tema-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{color:var(--muted);font-size:.78rem;width:2ch;flex:none;text-align:right}
  .tema-main{flex:1;min-width:0}
  .concepto{font-size:.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .magnitud{margin-top:6px;height:8px;border-radius:4px;background:#0c0e13;overflow:hidden}
  .magnitud i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
  .total{flex:none;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;width:5ch;text-align:right}
  .caret{flex:none;color:var(--muted);transition:transform .15s}
  .tema.abierto .caret{transform:rotate(90deg)}

  .evolucion{display:none;padding:4px 16px 18px}
  .tema.abierto .evolucion{display:block}
  .chart{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:22px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
       height:100%;position:relative;min-width:0}
  .col .valor{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:4px}
  .col .barra{width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--accent);
              transition:filter .1s}
  .col:hover .barra, .col:focus-visible .barra{filter:brightness(1.25)}
  .col:focus-visible{outline:none}
  .col .anio{margin-top:6px;font-size:.72rem;color:var(--muted)}
  .col[tabindex]{cursor:default}
  .tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;
       background:#0c0e13;border:1px solid var(--border);border-radius:6px;padding:3px 8px;
       font-size:.72rem;color:var(--fg);white-space:nowrap;opacity:0;pointer-events:none;
       transition:opacity .1s}
  .col:hover .tip, .col:focus-visible .tip{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Temas <span>principales</span></h1>
  <div class="sub">Conceptos más frecuentes del grafo de conocimiento y cuántos artículos los tocan cada año</div>
</header>
<div class="wrap">
  <a class="back" href="/">&larr; volver al buscador</a>
  <div class="filterbar">
    <input id="q" type="search" placeholder="Filtrar temas… p. ej. evaluación, IA, gamificación" autofocus>
  </div>
  <div class="status" id="status"></div>
  <div id="lista"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const lista = $("#lista");
let datos = {anios: [], temas: []};

function esc(t){return (t||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function grafico(tema){
  const max = Math.max(1, ...datos.anios.map(a => tema.por_anio[a] || 0));
  const cols = datos.anios.map(anio => {
    const n = tema.por_anio[anio] || 0;
    const alto = Math.round((n / max) * 78);
    return `<div class="col" tabindex="0">
      <div class="tip">JENUI ${anio}: ${n} artículo${n===1?'':'s'}</div>
      <div class="valor">${n || ''}</div>
      <div class="barra" style="height:${Math.max(alto,2)}px"></div>
      <div class="anio">${anio}</div>
    </div>`;
  }).join("");
  return `<div class="chart">${cols}</div>`;
}

function fila(tema, i, max){
  const pct = Math.max(4, Math.round((tema.total / max) * 100));
  return `
    <div class="tema" data-idx="${i}">
      <button class="tema-row" aria-expanded="false">
        <span class="rank">${i+1}</span>
        <span class="tema-main">
          <span class="concepto">${esc(tema.concepto)}</span>
          <span class="magnitud"><i style="width:${pct}%"></i></span>
        </span>
        <span class="total">${tema.total}</span>
        <span class="caret">&#9656;</span>
      </button>
      <div class="evolucion"></div>
    </div>`;
}

function render(temas){
  if(!temas.length){ lista.innerHTML = `<div class="empty">Sin temas que coincidan.</div>`; return; }
  const max = Math.max(...temas.map(t => t.total));
  lista.innerHTML = temas.map((t,i) => fila(t,i,max)).join("");
  lista.querySelectorAll(".tema-row").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".tema");
      const abierto = card.classList.toggle("abierto");
      btn.setAttribute("aria-expanded", abierto);
      const hueco = card.querySelector(".evolucion");
      if(abierto && !hueco.dataset.pintado){
        const tema = temas[Number(card.dataset.idx)];
        hueco.innerHTML = grafico(tema);
        hueco.dataset.pintado = "1";
      }
    });
  });
}

function filtrar(){
  const q = $("#q").value.trim().toLowerCase();
  const filtrados = q
    ? datos.temas.filter(t => t.concepto.toLowerCase().includes(q))
    : datos.temas;
  render(filtrados);
}

async function cargar(){
  try{
    datos = await (await fetch("/api/topics?limit=60")).json();
    $("#status").textContent = `${datos.temas.length} temas · JENUI ${datos.anios[0]}–${datos.anios[datos.anios.length-1]}`;
    render(datos.temas);
  }catch(e){
    lista.innerHTML = `<div class="empty">Error cargando los temas: ${esc(e.message)}</div>`;
  }
}

$("#q").addEventListener("input", filtrar);
cargar();
</script>
</body>
</html>
